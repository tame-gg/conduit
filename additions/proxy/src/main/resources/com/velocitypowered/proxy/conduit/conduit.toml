# conduit.toml — Conduit configuration
# This file is separate from velocity.toml so upstream merges stay clean.
# All settings here are optional; built-in defaults are listed as comments.

# ─────────────────────────────────────────────────────────────────────────────
# [modded] — Settings for modded Minecraft client/server compatibility
# ─────────────────────────────────────────────────────────────────────────────
[modded]

# Maximum number of known data-packs a client may send during the configuration
# phase.  Vanilla Velocity caps this at 64, which is too low for most modpacks.
# Raise this to accommodate heavily modded clients (NeoForge, Fabric with many
# data-pack mods, etc.).  Values above 10 000 may cause memory pressure.
# Overridden at startup by -Dvelocity.max-known-packs=<n> if that JVM flag is set.
max-known-packs = 1024

# Cache the result of the mod-list negotiation per (client-IP, mod-fingerprint)
# pair.  On a re-connect the cached handshake is replayed, skipping the round-
# trip entirely and shaving 50–400 ms off the join time on modded servers.
handshake-cache = true

# How long (seconds) a cached handshake result stays valid.  Set to 0 to disable.
handshake-cache-ttl = 300

# How long (ms) to wait for a modded client to finish the handshake before
# dropping the connection.  Increase for very large modpacks on slow links.
handshake-timeout-ms = 30000

# Enable extra compatibility shims for NeoForge FML3 clients.
# Disabling this only makes sense if you run a purely vanilla / Fabric network.
neoforge-compat = true

# Enable compatibility handling for legacy Forge (FML1/FML2) clients.
legacy-forge-compat = true

# Include a [MODDED] tag in server list ping responses so launchers can filter.
announce-modded-in-ping = false

# Log the full mod list when a modded client connects (verbose; for debugging).
log-mod-handshakes = false


# ─────────────────────────────────────────────────────────────────────────────
# [network] — Low-level networking tuning
# ─────────────────────────────────────────────────────────────────────────────
[network]

# Netty write-buffer watermarks (bytes).  The proxy pauses writes to a channel
# when its buffer exceeds the high mark, and resumes at the low mark.  Higher
# values smooth out bursty traffic at the cost of peak memory; lower values
# reduce latency but may cause micro-stalls under heavy load.
write-buffer-high-watermark = 2097152   # 2 MiB
write-buffer-low-watermark  = 1048576   # 1 MiB

# Use Conduit's pre-flight compression path. Above-threshold packets still fall
# back to a valid compressed frame when the smart path declines, preserving
# compatibility with peers that enforce the negotiated compression threshold.
smart-compression = true

# Minimum bytes saved before the smart path is accepted. Packets below this
# saving still use vanilla compression so the wire protocol remains valid.
smart-compression-min-delta = 64

# Batch outbound packets during server transitions to avoid N round-trips.
# Significantly improves transfer speed on modded servers with large state.
packet-queue-optimization = true

# Maximum queued packets per player during a server switch.  Excess packets are
# flushed immediately.  Tune down if memory pressure is observed during switches.
packet-queue-max-depth = 256

# Rate-limit new TCP connections to the proxy (helps under DDoS / bot floods).
connection-throttle = true
connection-throttle-max-per-second = 30

# How connection sources are grouped for the throttle and the bot filter, as CIDR
# prefix lengths.  IPv4 defaults to /32 (one counter per address).  IPv6 defaults
# to /64 because that is the smallest block normally handed to one subscriber: an
# attacker with a single /64 owns 2^64 addresses, and counting each one separately
# means the limits never trigger and the tracking tables thrash.  Lower the IPv4
# value (e.g. 24) only if you are willing to rate-limit whole networks together.
connection-throttle-ipv4-prefix = 32
connection-throttle-ipv6-prefix = 64

# Minimum gap, in milliseconds, between "dropping connections from X" log lines for
# one source; drops in between are counted and reported in the next line.  A flood
# is exactly when per-connection logging would become its own denial of service.
# Set to 0 to log every drop.
connection-throttle-log-interval-ms = 5000

# Cache backend tab-completion responses for a short TTL.  Heavy tab spam on creative/build
# servers currently re-hits the backend; this absorbs the burst at near-zero CPU on the proxy.
# Entries are keyed on (player, server, prefix): completions are permission-filtered for the
# player who asked, so a shared entry would replay a staff member's command list to everyone.
# Default is OFF because the integration point in ClientPlaySessionHandler is opt-in.
tab-complete-cache              = false
tab-complete-cache-ttl-ms       = 1500
tab-complete-cache-max-entries  = 1024


# ─────────────────────────────────────────────────────────────────────────────
# [diagnostics] — Debug and observability options
# ─────────────────────────────────────────────────────────────────────────────
[diagnostics]

# Emit structured timing logs for every player connection.
# Useful for profiling but adds overhead; keep off in production.
enabled = false

# Log every packet exchanged during the mod handshake phase.
# Implies enabled = true.  Very verbose — use only for debugging.
trace-mod-handshakes = false

# Log a warning when a player's initial login takes longer than this (ms).
slow-connection-threshold-ms = 3000


# ─────────────────────────────────────────────────────────────────────────────
# [server] — Backend health, fallback routing, MOTD cache, shutdown, bot filter
# ─────────────────────────────────────────────────────────────────────────────
[server]

# Periodically ping every registered backend server; servers that don't respond
# within (interval / 2) are marked UNHEALTHY and excluded from fallback routing.
health-check-enabled     = true
health-check-interval-ms = 10000

# Hysteresis.  A backend is only marked unhealthy after this many consecutive failed
# pings, and only marked healthy again after this many consecutive successful ones.
# Flipping on a single missed ping makes routing flap, because one long GC pause on a
# backend is enough to miss one.  Set failure-threshold to 1 for the old behaviour.
health-check-failure-threshold = 3
health-check-success-threshold = 2

# Ordered list of preferred fallback server names, as they appear in velocity.toml's
# [servers] table.  Quote them: TOML has no bare words, so ["hardcore", "lobby"] is
# valid and [hardcore, lobby] is a parse error.
#
# A player is sent to the first entry that is registered, healthy and not draining
# when they lose the server they were on:
#   * their backend kicked them or went down under them;
#   * their initial server could not be reached when they logged in;
#   * the proxy is shutting down (graceful-shutdown moves everyone here first).
# Velocity's own `try` list in velocity.toml is consulted first and is only
# overridden when the server it chose is one Conduit knows is down or draining.
# A player who still has their current server is left on it rather than moved.
#
# Leave empty to fall back to any other healthy server, and then to Velocity's
# default behaviour (disconnect).
fallback-servers = []

# Cache server-list ping responses.  Cuts CPU for status scanners and reduces
# backend ping volume.  Entries are keyed on (address, client protocol version,
# hostname), so two clients behind one NAT — or one client pinging two of your
# hostnames — never receive each other's answer.  TTL is in milliseconds; the
# cache is bounded to 4 096 distinct keys (LRU eviction beyond that).
motd-cache-enabled = true
motd-cache-ttl-ms  = 2000

# On JVM shutdown, transfer connected players to a fallback server before the
# proxy exits.  If no fallback is configured (or all are unhealthy/missing) the
# players are disconnected with the configured message.  The shutdown hook
# waits up to graceful-shutdown-timeout-ms for transfers to complete.
graceful-shutdown-enabled    = true
graceful-shutdown-timeout-ms = 5000
graceful-shutdown-message    = "Proxy is restarting. Please reconnect in a moment."

# Block IPs that repeatedly open TCP connections but never finish the handshake
# (a common bot-flood pattern).  An IP that triggers `bot-filter-threshold`
# incomplete handshakes within a rolling 60-second window is blocked for 10
# minutes (renewed by further incomplete handshakes).
bot-filter-enabled    = true
bot-filter-timeout-ms = 3000
bot-filter-threshold  = 10


# ─────────────────────────────────────────────────────────────────────────────
# [security] — Plugin-message channel guard
# ─────────────────────────────────────────────────────────────────────────────
[security]

# Intercept player-originated plugin messages on known cheat / exploit channels
# (World-Downloader, X-Ray clients, etc.).  Matching is case-insensitive; a pattern ending in
# ':' matches any channel under that namespace, otherwise the match is exact.
#
# action:
#   "drop" — silently drop the message; the connection stays open (default).
#   "kick" — drop the message and disconnect the player.
#   "log"  — forward the message but emit a warning log line (useful for evaluation).
#
# Players with the `conduit.channelguard.bypass` permission are exempt from all blocks.
channel-guard          = false
channel-guard-preset   = "custom"
channel-guard-action   = "drop"
channel-guard-block-list = [
    "wdl:init",
    "wdl:control",
    "wdl:request",
    "world_downloader:init",
    "world_downloader:control",
    "world_downloader:request",
    "xaero:",
    "schematica:",
    "bsm:",
    "5zig:",
]

# Stricter live limits used by `/conduit attackmode on`. These do not rewrite
# this file; `/conduit attackmode off` restores the normal values above.
attack-mode-connection-throttle-max-per-second = 8
attack-mode-bot-filter-threshold = 3
attack-mode-motd-cache-ttl-ms = 10000


# ─────────────────────────────────────────────────────────────────────────────
# [routing] — Backend compatibility rules
# ─────────────────────────────────────────────────────────────────────────────
[routing]

# Optional per-backend client-loader allow rules. Format:
#   "server=VANILLA,FABRIC,LEGACY_FORGE,NEOFORGE,UNKNOWN_MODDED"
# Servers without a rule keep Velocity's default behavior.
mod-compatibility = []


# ─────────────────────────────────────────────────────────────────────────────
# [metrics] — Lightweight diagnostics endpoint
# ─────────────────────────────────────────────────────────────────────────────
[metrics]

# Expose Conduit diagnostics counters over HTTP.
# Keep this bound to loopback unless you put it behind your own firewall.
http-enabled = false
http-host = "127.0.0.1"
http-port = 9589

# Path serving the compact JSON snapshot.
http-path = "/metrics"

# Path serving the same counters in the Prometheus text exposition format, so the
# endpoint can be scraped directly.  Must differ from http-path.
prometheus-path = "/metrics/prometheus"

# When set, every request must carry `Authorization: Bearer <token>` or it is
# refused with 401.  Leave empty for no authentication (fine on loopback; set a
# token before binding http-host anywhere else).
auth-token = ""


# ─────────────────────────────────────────────────────────────────────────────
# [maintenance] — Network-wide maintenance mode
# ─────────────────────────────────────────────────────────────────────────────
# Reject non-exempt players with a custom message while you work on the network,
# and optionally advertise a maintenance MOTD in the server-list ping. Toggle it
# live with `/conduit maintenance on|off|status` (permission: conduit.admin).
#
# A player is allowed in if they hold the `conduit.maintenance.bypass` permission
# OR their username appears in `allowlist` below (handy before a permissions
# plugin has loaded). Conduit seeds that bypass node (and other conduit.* nodes)
# into LuckPerms at startup so it autocompletes in /lpv and the web editor.
# The active state is persisted to `maintenance.flag` so it survives a restart —
# delete that file to clear maintenance manually.
[maintenance]

# Register the maintenance listeners. Set false to disable the feature entirely.
enabled = true

# Start the proxy already in maintenance mode.
active-on-start = false

# MiniMessage-formatted disconnect message shown to denied players.
kick-message = "<red>The network is currently down for maintenance.\n<gray>Please check back soon."

# MiniMessage-formatted MOTD shown in the server list while maintenance is active.
# Leave blank ("") to keep the normal MOTD.
motd = "<red><bold>⚠ Maintenance</bold></red>\n<gray>The network is temporarily offline."

# Usernames (case-insensitive) always allowed to connect during maintenance.
allowlist = []


# ─────────────────────────────────────────────────────────────────────────────
# [versions] — Advertised / accepted Minecraft client versions
# ─────────────────────────────────────────────────────────────────────────────
# Restrict which Minecraft versions may join the network, and advertise that
# range in the server list.
#
# Clients inside the range see the network exactly as before: your normal MOTD,
# the ping bars, and the live player count. Clients outside it get the vanilla
# "incompatible version" server-list entry — a red cross instead of the ping
# bars, with `ping-version-name` shown where the player count would be — and are
# told which versions to use if they try to connect.
[versions]

# Master switch. When false (the default) nothing is restricted and every
# version this proxy build supports may join.
enabled = false

# There are two ways to describe which versions you accept: a contiguous range
# (minimum/maximum, below) or an explicit list of individual versions (`allow`).
# Both accept a version name ("1.21.11") or a raw protocol number ("774") — the
# latter is handy for pinning a version this build does not name yet.
#
# `allow` lists individual versions and is the only way to accept a set with
# gaps in it. Order does not matter, and duplicates are ignored. When it is
# non-empty it is the whole accepted set and minimum/maximum are ignored.
#   allow = ["1.21", "1.21.1", "1.21.11"]   # exactly these three, nothing else
#   allow = ["1.8", "1.21.11"]              # the classic PvP version and current
#   allow = ["774"]                          # same as ["1.21.11"], by protocol
# Note that 1.21 and 1.21.1 share one protocol number, as do several other pairs
# of releases — listing either name accepts both, and the server list and kick
# message say so ("1.21–1.21.1"). That is Mojang's doing, not a setting: the
# proxy cannot tell those two clients apart.
allow = []

# Lowest and highest Minecraft version accepted, inclusive — used when `allow`
# is empty. Set both to the same value to pin one exact version. Leave a bound
# blank ("") for "no limit on that end", e.g. minimum = "1.21.4" with
# maximum = "" allows 1.21.4 and anything newer.
minimum = "1.21.11"
maximum = "1.21.11"

# Text shown in the server-list version slot to clients outside the accepted
# set. This is plain text (the client renders it in red itself), not MiniMessage.
#   {versions} — the accepted versions, e.g. "1.21.11", "1.21.4–1.21.11", or
#                "1.8, 1.21.4, 1.21.11" for an allow list
#   {min} / {max} — the lowest and highest accepted version
ping-version-name = "Conduit {versions}"

# MiniMessage disconnect message shown when someone tries to join on an
# unsupported version. `kick-message` is used when exactly one version is
# allowed, `kick-message-range` when several are (a range or an allow list).
# Same placeholders as above.
kick-message = "<red>This network only allows players to join on version <white>{versions}</white>."
kick-message-range = "<red>This network only allows players to join on versions <white>{versions}</white>."

# ─────────────────────────────────────────────────────────────────────────────
# [commands] — Operator commands surfaced by Conduit
# ─────────────────────────────────────────────────────────────────────────────
[commands]

# Register the `/conduit` admin command.  Permission: `conduit.admin`.
# Subcommands: reload, diagnostics, health, unblock <ip>, cache invalidate <ip>
admin-enabled = true

# Register the `/modlist [player]` command.  Permission: `conduit.modlist`.
# Shows the mod loader and registered channel set for each connected player.
modlist-enabled = true


# ─────────────────────────────────────────────────────────────────────────────
# [forwarding] — Backend → proxy command forwarding
# ─────────────────────────────────────────────────────────────────────────────
# Lets a backend server ask the proxy to run a command, using the wire protocol of the
# VelocityCommandForward plugin (https://github.com/ItsTauTvyDas/VelocityCommandForward). This
# replaces the proxy-side plugin: install only the *backend* half of VelocityCommandForward on your
# Paper/Spigot servers and enable this section instead of the Velocity plugin.
#
# A backend player or console runs `/proxyexec <command>` (the backend command); the command is then
# executed on the proxy as the proxy console, or as the forwarding player if a player sent it.
# Because forwarded commands run with console/player authority, only real backend connections are
# honoured, and you can additionally gate player-context commands behind a permission below.
#
# NOTE: plugin messaging needs at least one player online for a console-originated command to reach
# the proxy — this is a Minecraft limitation, not a Conduit one.
[forwarding]

# Master switch. Default false preserves current behaviour: with no backend plugin installed this
# does nothing, and existing installs are unaffected until you opt in.
command-forwarding = false

# The plugin-messaging channel the backend sends on. Must match the backend plugin; leave this as
# the upstream default unless you have changed it on the backend side.
channel = "velocity_command_forward:main"

# When true, a command forwarded on behalf of a player only runs if that player holds the
# `conduit.forward.execute` permission. This stops unauthorised players (e.g. alts with no grants)
# from forwarding proxy commands. Console-originated commands (from a trusted backend console) are
# always allowed. NOTE: Velocity has no permission registry, so this node will NOT autocomplete in
# the LuckPerms web editor — grant it explicitly, e.g.
# `/lpv user <name> permission set conduit.forward.execute true` (or to a staff group).
# Default false matches upstream VelocityCommandForward behaviour.
require-permission = false

# Echo the backend-supplied log line to the proxy console when a command is forwarded (commands the
# backend marks as "filtered" are always silent). Set false to keep the proxy console quiet.
# The line is flattened to one line and length-capped before it is printed, so a backend cannot
# forge log entries that look like they came from the proxy.
log-forwarded-commands = true

# Backends allowed to forward commands, by server name. Empty means every backend may.
# A forwarded console command carries the proxy console's full authority, so if any backend on the
# network is less trusted than your own — a community-run minigame box, say — name the ones that
# may forward here.
allowed-servers = []

# Root command words a backend may forward. Empty means every command is allowed.
# e.g. command-allowlist = ["send", "alert"]
command-allowlist = []

# Root command words that are always refused, regardless of the allow-list.
# e.g. command-denylist = ["sparkv", "conduit"]
command-denylist = []


# ─────────────────────────────────────────────────────────────────────────────
# [update] — Update checker
# ─────────────────────────────────────────────────────────────────────────────
# Conduit can check GitHub Releases for a newer version. The check runs
# asynchronously after startup, never blocks the proxy, caches its result, and
# degrades quietly if GitHub is unreachable or rate-limited.
[update]

# Master switch for the whole update checker.
enabled = true

# Log a single line to the console at startup summarising the result.
notify-on-startup = true

# Tell players holding `conduit.update.notify` about a newer release when they
# join.  Ordinary players never see this message.
notify-on-join = true

# The GitHub repository (owner/name) whose Releases are compared against the
# running build.  Semantic-version tags such as `v1.3.5` are understood.
github-repository = "tame-gg/conduit"

# Whether pre-releases count as upgrade targets.  A pre-release build always
# considers newer pre-releases regardless of this setting.
include-prereleases = false

# How long (minutes) a computed result is reused before a background refresh.
cache-minutes = 360


# ─────────────────────────────────────────────────────────────────────────────
# [spark] — Bundled profiler
# ─────────────────────────────────────────────────────────────────────────────
[spark]

# Conduit ships the official spark Velocity profiler and extracts it into
# plugins/ automatically.  If you prefer to manage spark yourself (or don't
# want it), set this to false.  If any spark jar already exists in plugins/,
# Conduit leaves it alone regardless of this setting.
bundle-enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# [luckperms] — Bundled permissions
# ─────────────────────────────────────────────────────────────────────────────
[luckperms]

# Conduit ships the official LuckPerms Velocity plugin and extracts it into
# plugins/ automatically, so permissions and groups work natively out of the
# box.  Once LuckPerms is present, Conduit's advanced permission resolver lights
# up automatically.  If you prefer to manage LuckPerms yourself (or don't want
# it), set this to false.  If any LuckPerms jar already exists in plugins/,
# Conduit leaves it alone regardless of this setting.
bundle-enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# [advanced] — Experimental protocol behaviour
# ─────────────────────────────────────────────────────────────────────────────
[advanced]

# Experimental seamless server switches for 1.20.2+ clients: same-dimension moves
# between compatible backends skip the config screen and keep the world loaded.
# Other cases fall back to the normal switch. Leave off unless backends match.
# (Based on ohemilyy's seamless-switch patch, commit b5a97c65.)
seamless-server-switches = false

# Settle delay (ms) after a seamless switch. Briefly holds the player's input so
# they can't move before the new server loads them in (which would leave them
# "stuck" until reconnect). 0 = instant. Range 0–5000.
seamless-switch-settle-ms = 250

# Teleport cue played to the player on a seamless switch. Any sound key works.
seamless-switch-sound-enabled = true
seamless-switch-sound = "minecraft:entity.enderman.teleport"
seamless-switch-sound-volume = 1.0
seamless-switch-sound-pitch = 1.0
